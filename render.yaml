services:
  - type: web
    name: figurinhas-premium
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build && cd ..
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: WHATSAPP_NUMBER
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.20.1
      - key: DATABASE_URL
        fromDatabase:
          name: figurinhas-db
          property: connectionString

databases:
  - name: figurinhas-db
    plan: free
    region: oregon
