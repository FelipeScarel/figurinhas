<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Figurinhas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
    <style>
      ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
      .spinner{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
      .toast-msg{animation:toastIn .3s ease-out}@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-white font-extrabold text-xs">FS</div>
                <span class="font-bold text-gray-900 hidden sm:inline">Admin</span>
            </div>
            <a href="/admin/dashboard" class="text-sm font-semibold text-amber-600 border-b-2 border-amber-500 pb-0.5">Pedidos</a>
            <a href="/admin/vitrine" class="text-sm text-gray-500 hover:text-gray-900">Vitrine</a>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-gray-400 text-xs">{{ session.get('admin_username', 'Admin') }}</span>
            <a href="/" class="text-gray-400 hover:text-gray-600 text-xs">Site</a>
            <a href="{{ url_for('auth.logout') }}" class="text-red-500 hover:text-red-400 text-xs font-medium">Sair</a>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-6">

    <!-- Stats -->
    <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 mb-6">
        <div class="bg-white rounded-xl p-4 border border-gray-200"><p class="text-gray-400 text-xs font-medium uppercase">Total</p><p class="text-2xl font-bold mt-1" id="stat-total">-</p></div>
        <div class="bg-white rounded-xl p-4 border border-amber-200"><p class="text-amber-600 text-xs font-medium uppercase">Pendentes</p><p class="text-2xl font-bold text-amber-600 mt-1" id="stat-pending">-</p></div>
        <div class="bg-white rounded-xl p-4 border border-blue-200"><p class="text-blue-600 text-xs font-medium uppercase">Análise</p><p class="text-2xl font-bold text-blue-600 mt-1" id="stat-analysis">-</p></div>
        <div class="bg-white rounded-xl p-4 border border-purple-200"><p class="text-purple-600 text-xs font-medium uppercase">Produção</p><p class="text-2xl font-bold text-purple-600 mt-1" id="stat-production">-</p></div>
        <div class="bg-white rounded-xl p-4 border border-emerald-200"><p class="text-emerald-600 text-xs font-medium uppercase">Finalizados</p><p class="text-2xl font-bold text-emerald-600 mt-1" id="stat-finished">-</p></div>
        <div class="bg-white rounded-xl p-4 border border-red-200"><p class="text-red-600 text-xs font-medium uppercase">Urgentes</p><p class="text-2xl font-bold text-red-600 mt-1" id="stat-urgent">-</p></div>
    </div>

    <!-- Search -->
    <div class="flex gap-2 mb-6">
        <input type="text" id="search-input" placeholder="Buscar por nome ou WhatsApp..." class="flex-1 bg-white border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500">
        <button id="search-btn" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium">Buscar</button>
    </div>

    <!-- Table -->
    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
        <table class="w-full text-sm">
            <thead><tr class="border-b border-gray-200 bg-gray-50">
                <th class="text-left px-4 py-3 text-gray-500 text-xs font-medium uppercase">ID</th>
                <th class="text-left px-4 py-3 text-gray-500 text-xs font-medium uppercase">Data</th>
                <th class="text-left px-4 py-3 text-gray-500 text-xs font-medium uppercase">Cliente</th>
                <th class="text-left px-4 py-3 text-gray-500 text-xs font-medium uppercase">Detalhes</th>
                <th class="text-center px-4 py-3 text-gray-500 text-xs font-medium uppercase">Arquivos</th>
                <th class="text-center px-4 py-3 text-gray-500 text-xs font-medium uppercase">Status</th>
                <th class="text-center px-4 py-3 text-gray-500 text-xs font-medium uppercase">Ações</th>
            </tr></thead>
            <tbody id="orders-tbody" class="divide-y divide-gray-100"><tr><td colspan="7" class="text-center py-12 text-gray-400"><div class="animate-pulse">Carregando...</div></td></tr></tbody>
        </table>
    </div>
    <div id="empty-state" class="hidden text-center py-16 text-gray-400"><p>Nenhum pedido encontrado.</p></div>
</div>

<!-- Modal -->
<div id="order-modal" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold" id="modal-order-title">Pedido #—</h3><button onclick="closeOrderModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div>
        <div id="modal-order-body" class="space-y-4"></div>
        <button onclick="closeOrderModal()" class="w-full mt-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-xl text-sm">Fechar</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
