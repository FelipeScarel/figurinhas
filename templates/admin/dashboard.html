<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Figurinhas Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        gold: {
                            50: '#fef9e7', 100: '#fcf0c3', 200: '#f9e39b', 300: '#f5d46e',
                            400: '#f0c64a', 500: '#D4AF37', 600: '#c4a233', 700: '#a8892a',
                            800: '#8c7122', 900: '#725a1b', 950: '#544213',
                        },
                        graphite: {
                            50: '#f4f4f5', 100: '#e4e4e7', 200: '#c9c9ce', 300: '#a1a1aa',
                            400: '#71717a', 500: '#52525b', 600: '#3f3f46', 700: '#2a2a2e',
                            800: '#1a1a1d', 850: '#151518', 900: '#121214', 950: '#0a0a0b',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-graphite-900 text-white font-sans antialiased min-h-screen">

    <!-- Top Navigation -->
    <nav class="sticky top-0 z-50 bg-graphite-900/95 backdrop-blur-sm border-b border-graphite-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-graphite-900 font-extrabold text-sm shadow-lg shadow-gold-500/20">FS</div>
                        <span class="font-bold text-white hidden sm:inline font-display">Admin</span>
                    </div>
                    <a href="/admin/dashboard" class="text-sm font-medium text-gold-400 border-b-2 border-gold-500 pb-0.5">Pedidos</a>
                    <a href="/admin/vitrine" class="text-sm font-medium text-graphite-400 hover:text-white transition-colors">Vitrine</a>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-graphite-400 text-xs hidden sm:inline">{{ session.get('admin_username', 'Admin') }}</span>
                    <a href="/" class="text-graphite-400 hover:text-white text-xs transition-colors">Site</a>
                    <a href="{{ url_for('auth.logout') }}" class="text-red-400 hover:text-red-300 text-xs font-medium transition-colors">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-8" id="stats-grid">
            <div class="bg-graphite-800 border border-graphite-700 rounded-xl p-4">
                <p class="text-graphite-400 text-xs font-medium uppercase tracking-wide">Total</p>
                <p class="text-2xl font-bold text-white mt-1" id="stat-total">-</p>
            </div>
            <div class="bg-graphite-800 border border-yellow-500/20 rounded-xl p-4">
                <p class="text-yellow-400 text-xs font-medium uppercase tracking-wide">Pendentes</p>
                <p class="text-2xl font-bold text-yellow-300 mt-1" id="stat-pending">-</p>
            </div>
            <div class="bg-graphite-800 border border-blue-500/20 rounded-xl p-4">
                <p class="text-blue-400 text-xs font-medium uppercase tracking-wide">Em Análise</p>
                <p class="text-2xl font-bold text-blue-300 mt-1" id="stat-analysis">-</p>
            </div>
            <div class="bg-graphite-800 border border-purple-500/20 rounded-xl p-4">
                <p class="text-purple-400 text-xs font-medium uppercase tracking-wide">Produção</p>
                <p class="text-2xl font-bold text-purple-300 mt-1" id="stat-production">-</p>
            </div>
            <div class="bg-graphite-800 border border-emerald-500/20 rounded-xl p-4">
                <p class="text-emerald-400 text-xs font-medium uppercase tracking-wide">Finalizados</p>
                <p class="text-2xl font-bold text-emerald-300 mt-1" id="stat-finished">-</p>
            </div>
            <div class="bg-graphite-800 border border-red-500/20 rounded-xl p-4">
                <p class="text-red-400 text-xs font-medium uppercase tracking-wide">Urgentes</p>
                <p class="text-2xl font-bold text-red-300 mt-1" id="stat-urgent">-</p>
            </div>
        </div>

        <!-- Search -->
        <div class="flex items-center gap-3 mb-6">
            <div class="relative flex-1">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-graphite-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="search-input" placeholder="Buscar por nome ou WhatsApp..."
                       class="w-full bg-graphite-800 border border-graphite-700 rounded-xl pl-10 pr-4 py-2.5 text-white text-sm placeholder-graphite-500 focus:outline-none focus:ring-2 focus:ring-gold-500/50 focus:border-gold-500 transition-all">
            </div>
            <button id="search-btn" class="bg-graphite-700 hover:bg-graphite-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-all border border-graphite-600 active:scale-95">
                Buscar
            </button>
        </div>

        <!-- Orders Table -->
        <div class="bg-graphite-800 border border-graphite-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-graphite-700 bg-graphite-850">
                            <th class="text-left px-4 py-3 text-graphite-400 font-medium text-xs uppercase tracking-wider">ID</th>
                            <th class="text-left px-4 py-3 text-graphite-400 font-medium text-xs uppercase tracking-wider">Data</th>
                            <th class="text-left px-4 py-3 text-graphite-400 font-medium text-xs uppercase tracking-wider">Cliente</th>
                            <th class="text-left px-4 py-3 text-graphite-400 font-medium text-xs uppercase tracking-wider">Detalhes</th>
                            <th class="text-center px-4 py-3 text-graphite-400 font-medium text-xs uppercase tracking-wider">Arquivos</th>
                            <th class="text-center px-4 py-3 text-graphite-400 font-medium text-xs uppercase tracking-wider">Status</th>
                            <th class="text-center px-4 py-3 text-graphite-400 font-medium text-xs uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody" class="divide-y divide-graphite-700">
                        <tr>
                            <td colspan="7" class="text-center py-12 text-graphite-500">
                                <div class="animate-pulse">Carregando pedidos...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="empty-state" class="hidden text-center py-16">
            <div class="text-5xl mb-4">&#128230;</div>
            <p class="text-graphite-400 text-lg">Nenhum pedido encontrado.</p>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div id="order-modal" class="fixed inset-0 z-[90] hidden bg-graphite-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-graphite-800 border border-graphite-700 rounded-2xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-white font-display" id="modal-order-title">Pedido #—</h3>
                <button onclick="closeOrderModal()" class="text-graphite-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div id="modal-order-body" class="space-y-4"></div>
            <button onclick="closeOrderModal()" class="w-full mt-4 bg-graphite-700 hover:bg-graphite-600 text-white font-medium py-2.5 rounded-xl text-sm transition-all">Fechar</button>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
