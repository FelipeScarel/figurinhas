<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Figurinhas Adesivas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843',950:'#500724' },
                        surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',850:'#172033',900:'#0f172a',950:'#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-surface-950 text-white font-sans antialiased min-h-screen">

    <!-- Top Bar -->
    <nav class="sticky top-0 z-50 bg-surface-900/95 backdrop-blur-sm border-b border-surface-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-extrabold text-sm shadow-lg shadow-brand-500/25">FS</div>
                    <span class="font-bold text-white hidden sm:inline">Dashboard Admin</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-surface-400 text-xs hidden sm:inline">{{ session.get('admin_username', 'Admin') }}</span>
                    <a href="/" class="text-surface-400 hover:text-white text-xs transition-colors">Site</a>
                    <a href="{{ url_for('auth.logout') }}" class="text-red-400 hover:text-red-300 text-xs font-medium transition-colors">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-8" id="stats-grid">
            <div class="bg-surface-900 border border-surface-800 rounded-xl p-4">
                <p class="text-surface-400 text-xs font-medium uppercase tracking-wide">Total</p>
                <p class="text-2xl font-bold text-white mt-1" id="stat-total">-</p>
            </div>
            <div class="bg-surface-900 border border-yellow-800/30 rounded-xl p-4">
                <p class="text-yellow-400 text-xs font-medium uppercase tracking-wide">Pendentes</p>
                <p class="text-2xl font-bold text-yellow-300 mt-1" id="stat-pending">-</p>
            </div>
            <div class="bg-surface-900 border border-blue-800/30 rounded-xl p-4">
                <p class="text-blue-400 text-xs font-medium uppercase tracking-wide">Em Análise</p>
                <p class="text-2xl font-bold text-blue-300 mt-1" id="stat-analysis">-</p>
            </div>
            <div class="bg-surface-900 border border-purple-800/30 rounded-xl p-4">
                <p class="text-purple-400 text-xs font-medium uppercase tracking-wide">Em Produção</p>
                <p class="text-2xl font-bold text-purple-300 mt-1" id="stat-production">-</p>
            </div>
            <div class="bg-surface-900 border border-emerald-800/30 rounded-xl p-4">
                <p class="text-emerald-400 text-xs font-medium uppercase tracking-wide">Finalizados</p>
                <p class="text-2xl font-bold text-emerald-300 mt-1" id="stat-finished">-</p>
            </div>
        </div>

        <!-- Search -->
        <div class="flex items-center gap-3 mb-6">
            <div class="relative flex-1">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-surface-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="search-input" placeholder="Buscar por nome ou WhatsApp..."
                       class="w-full bg-surface-900 border border-surface-700 rounded-xl pl-10 pr-4 py-2.5 text-white text-sm placeholder-surface-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all">
            </div>
            <button id="search-btn" class="bg-surface-800 hover:bg-surface-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-all border border-surface-700 active:scale-95">
                Buscar
            </button>
        </div>

        <!-- Orders Table -->
        <div class="bg-surface-900 border border-surface-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-surface-800 bg-surface-850">
                            <th class="text-left px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">ID</th>
                            <th class="text-left px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">Data</th>
                            <th class="text-left px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">Cliente</th>
                            <th class="text-left px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">WhatsApp</th>
                            <th class="text-center px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">Qtd</th>
                            <th class="text-left px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">Acabamento</th>
                            <th class="text-center px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">Arte</th>
                            <th class="text-center px-4 py-3 text-surface-400 font-medium text-xs uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody" class="divide-y divide-surface-800">
                        <tr>
                            <td colspan="8" class="text-center py-12 text-surface-500">
                                <div class="animate-pulse">Carregando pedidos...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="text-5xl mb-4">&#128230;</div>
            <p class="text-surface-400 text-lg">Nenhum pedido encontrado.</p>
            <p class="text-surface-500 text-sm mt-1">Os novos pedidos aparecerão aqui.</p>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
