<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine — Figurinhas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
    <style>
      ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
      .spinner{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
      .toast-msg{animation:toastIn .3s ease-out}@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-white font-extrabold text-xs">FS</div>
                <span class="font-bold text-gray-900 hidden sm:inline">Admin</span>
            </div>
            <a href="/admin/dashboard" class="text-sm text-gray-500 hover:text-gray-900">Pedidos</a>
            <a href="/admin/vitrine" class="text-sm font-semibold text-amber-600 border-b-2 border-amber-500 pb-0.5">Vitrine</a>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-gray-400 text-xs">{{ session.get('admin_username', 'Admin') }}</span>
            <a href="/" class="text-gray-400 hover:text-gray-600 text-xs">Site</a>
            <a href="{{ url_for('auth.logout') }}" class="text-red-500 hover:text-red-400 text-xs font-medium">Sair</a>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Vitrine</h1>
            <p class="text-gray-500 text-sm mt-0.5">Gerencie os modelos de adesivos</p>
        </div>
        <button onclick="openForm()" class="inline-flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Novo Modelo
        </button>
    </div>

    <div id="vitrine-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <div class="col-span-full text-center py-12 text-gray-400"><span class="spinner inline-block w-5 h-5 border-2 border-gray-300 border-t-amber-500 rounded-full"></span></div>
    </div>
    <div id="vitrine-empty" class="hidden text-center py-16 text-gray-400"><p>Nenhum modelo cadastrado.</p></div>
</div>

<!-- Form Modal -->
<div id="vitrine-modal" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold" id="vitrine-modal-title">Novo Modelo</h3><button onclick="closeForm()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div>
        <form id="vitrine-form" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" id="vitrine-edit-id" value="">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Imagem *</label>
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center cursor-pointer hover:border-amber-400 transition-colors bg-gray-50" id="vitrine-drop-zone">
                    <input type="file" name="imagem" id="vitrine-imagem-input" accept=".png,.jpg,.jpeg,.webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 hidden">
                    <div id="vitrine-drop-content">
                        <svg class="w-8 h-8 mx-auto text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <p class="text-sm text-gray-500">Clique para upload</p>
                    </div>
                    <img id="vitrine-preview-img" src="" class="hidden max-h-32 mx-auto rounded-lg mt-2">
                </div>
            </div>
            <div>
                <label for="vitrine-titulo" class="block text-sm font-medium text-gray-700 mb-1">Título *</label>
                <input type="text" id="vitrine-titulo" name="titulo" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500" placeholder="Ex: Coleção Aurora Dourada">
            </div>
            <div>
                <label for="vitrine-descricao" class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                <textarea id="vitrine-descricao" name="descricao" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500 resize-none" placeholder="Detalhes do adesivo..."></textarea>
            </div>
            <div>
                <label for="vitrine-preco" class="block text-sm font-medium text-gray-700 mb-1">Preço (R$) — deixe 0 para "Sob Consulta"</label>
                <input type="number" id="vitrine-preco" name="preco" step="0.01" min="0" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500" placeholder="0,00">
            </div>
            <div id="vitrine-active-field" class="hidden">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="vitrine-is-active" name="is_active" value="1" checked class="w-4 h-4 rounded text-amber-500 focus:ring-amber-500">
                    <span class="text-sm text-gray-700">Ativo na vitrine</span>
                </label>
            </div>
            <div class="flex gap-3 pt-1">
                <button type="submit" id="vitrine-submit-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2.5 rounded-xl text-sm">Salvar</button>
                <button type="button" onclick="closeForm()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-xl text-sm">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/admin-vitrine.js') }}"></script>
</body>
</html>
