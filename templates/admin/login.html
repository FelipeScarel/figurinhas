<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Figurinhas Adesivas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843',950:'#500724' },
                        surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',850:'#172033',900:'#0f172a',950:'#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-surface-950 text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-extrabold text-xl mx-auto shadow-lg shadow-brand-500/25 mb-4">
                FS
            </div>
            <h1 class="text-xl font-bold text-white">Acesso Admin</h1>
            <p class="text-surface-400 text-sm mt-1">Figurinhas Adesivas</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for category, message in messages %}
            <div class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium
                        {% if category == 'success' %}bg-emerald-600/20 text-emerald-300 border border-emerald-700
                        {% elif category == 'error' %}bg-red-600/20 text-red-300 border border-red-700
                        {% else %}bg-surface-800 text-surface-300 border border-surface-700{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" class="bg-surface-900 border border-surface-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-surface-300 mb-1.5">Usuário</label>
                <input type="text" id="username" name="username" required autofocus
                       class="w-full bg-surface-800 border border-surface-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-surface-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all"
                       placeholder="admin">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-surface-300 mb-1.5">Senha</label>
                <input type="password" id="password" name="password" required
                       class="w-full bg-surface-800 border border-surface-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-surface-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all"
                       placeholder="••••••••">
            </div>
            <button type="submit"
                    class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2.5 px-4 rounded-xl transition-all shadow-lg shadow-brand-600/20 active:scale-[0.98] text-sm">
                Entrar
            </button>
        </form>

        <p class="text-center text-surface-500 text-xs mt-6">
            <a href="/" class="hover:text-brand-400 transition-colors">&larr; Voltar para o site</a>
        </p>
    </div>

</body>
</html>
